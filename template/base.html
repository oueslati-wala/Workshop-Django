<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Conference</title>
    <style>
      nav a { margin-right: 12px; }
    </style>
  </head>
  <body>
    <nav>
      <a href="{% url 'liste_conferences' %}">Conférences</a>
      {% if request.user.is_authenticated %}
        <a href="{% url 'logout' %}">Se déconnecter</a>
        <a href="{% url 'submission_list' %}">Mes soumissions</a>
        <a href="{% url 'submission_add' %}">Ajouter une soumission</a>
      {% else %}
        <a href="{% url 'login' %}">Se connecter</a>
        <a href="{% url 'register' %}">Créer un compte</a>
      {% endif %}
    </nav>
    {% block content %}{% endblock %}
    <footer>
      <p>workshop Django 25/26 3ia2</p>
    </footer>
  </body>
</html>
